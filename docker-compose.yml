version: "3.9"
services:
  authentigate:
    build:
      context: .
      dockerfile: Dockerfile
    image: authentigate:local
    ports:
      - "443:443"
      - "8081:8081"
    volumes:
      - authentigate_users:/app/authentigate_users
      - authentigate_foreignids:/app/authentigate_foreignIDs
      - authentigate_sessiontokens:/app/authentigate_sessionTokens
      - authentigate_usernames:/app/authentigate_userNames
      - authentigate_certs:/app/.certs
    restart: unless-stopped

volumes:
  authentigate_users:
  authentigate_foreignids:
  authentigate_sessiontokens:
  authentigate_usernames:
  authentigate_certs:
