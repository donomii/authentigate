services:
  vhoster:
    build: .
    container_name: vhoster
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "3000:3000"
    volumes:
      - ./config.json:/app/config.json:ro
      - vhoster-logs:/app/logs
    environment:
      - TZ=UTC
      - LOG_FILE=/app/logs/accessLog
    command: ["./vhoster", "-develop"]  # Remove -develop flag for production with HTTPS

volumes:
  vhoster-logs:
